<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TOEIC 阅读题预览</title>
<style id="css">
* { box-sizing: border-box; }
body { margin:0; font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f4f6; color:#1f2937; }
header { background: linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; padding:14px 20px; }
header h1 { margin:0; font-size:18px; }
header .meta { font-size:12px; opacity:.85; margin-top:4px; }
.toolbar { background:#fff; padding:8px 16px; border-bottom:1px solid #e5e7eb; display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap; }
.toolbar button { background:#f3f4f6; border:1px solid #e5e7eb; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
.toolbar button.active { background:#2563eb; color:#fff; border-color:#2563eb; }
.layout { display:flex; height: calc(100vh - 110px); }
.sidebar { width:280px; background:#fff; border-right:1px solid #e5e7eb; overflow-y:auto; flex-shrink:0; }
.sidebar .section { padding:10px 14px; font-size:11px; font-weight:700; color:#6b7280; background:#f9fafb; border-bottom:1px solid #e5e7eb; }
.sidebar .item { padding:9px 14px; border-bottom:1px solid #f3f4f6; cursor:pointer; }
.sidebar .item:hover { background:#f9fafb; }
.sidebar .item.active { background:#dbeafe; border-left:3px solid #2563eb; padding-left:11px; }
.sidebar .item .gid { font-weight:600; font-size:13px; }
.sidebar .item .title { font-size:11px; color:#6b7280; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar .item .badge { display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px; background:#e0e7ff; color:#3730a3; margin-right:4px; }
.sidebar .item.part7 .badge { background:#fef3c7; color:#92400e; }
.main { flex:1; overflow-y:auto; padding:20px 28px; }
.empty { text-align:center; color:#9ca3af; padding:80px 20px; }
.group-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.group-header .pill { background:#2563eb; color:#fff; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:600; }
.group-header .pill.part7 { background:#d97706; }
.group-header .pill.test { background:#10b981; }
.group-header h2 { margin:0; font-size:18px; }
.passage { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:14px 18px; margin-bottom:14px; }
.passage h3 { margin:0 0 8px 0; font-size:13px; color:#1d4ed8; }
.passage .body { white-space:pre-wrap; line-height:1.7; font-size:13px; font-family: Georgia, serif; }
.passage .zh { background:#f0fdf4; padding:10px; border-radius:6px; margin-top:8px; border-left:3px solid #10b981; color:#374151; white-space:pre-wrap; line-height:1.7; font-size:13px; }
.vocab-card { background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:14px 18px; margin-bottom:14px; }
.vocab-card h3 { margin:0 0 10px 0; font-size:14px; color:#92400e; }
.vocab-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:6px 14px; font-size:12px; }
.vocab-list .word { padding:4px 0; border-bottom:1px dotted #fde68a; }
.vocab-list .word .w { font-weight:700; }
.vocab-list .word .pos { color:#9ca3af; font-size:11px; padding:0 4px; }
.vocab-list .word .m { color:#374151; }
.question { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:14px 18px; margin-bottom:14px; }
.question .num { font-weight:700; color:#2563eb; margin-right:6px; }
.question .stem { font-size:14px; line-height:1.6; margin-bottom:10px; }
.options { list-style:none; padding:0; margin:0 0 12px 0; }
.options li { padding:6px 12px; border:1px solid #e5e7eb; border-radius:6px; margin-bottom:6px; font-size:13px; }
.options li.correct { background:#d1fae5; border-color:#10b981; color:#065f46; font-weight:600; }
.options li .opt-letter { display:inline-block; width:24px; font-weight:700; }
.explanation { border-top:1px dashed #e5e7eb; padding-top:10px; font-size:13px; line-height:1.7; color:#374151; white-space:pre-wrap; }
.explanation .label { display:inline-block; font-weight:600; font-size:11px; color:#fff; padding:2px 8px; border-radius:4px; margin-right:6px; background:#10b981; }
.stats { font-size:12px; color:#6b7280; }
@media (max-width: 800px) { .layout { flex-direction:column; height:auto; } .sidebar { width:100%; max-height:240px; } .main { padding:14px; } }
</style>
</head>
<body>
<header><h1>TOEIC 阅读题预览（Part 6/7）</h1><div class="meta" id="meta">加载中...</div></header>
<div class="toolbar"><span>套题：</span><span id="testFilters"></span></div>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main" id="main"><div class="empty">从左侧选择题组</div></div>
</div>
<script id="js">
let groups = [];
let currentFilter = 'all';
let availableSources = [];

async function load() {
  const res = await fetch('set12_preview.json?t=' + Date.now());
  groups = await res.json();
  availableSources = Array.from(new Set(groups.map(g => g.source).filter(Boolean))).sort();
  renderFilters();
  renderSidebar();
  updateMeta();
}

function srcLabel(s) {
  if (!s) return '?';
  return s.replace(/^set/i, '公式').replace(/_test1$/i, ' 套1').replace(/_test2$/i, ' 套2');
}

function renderFilters() {
  const wrap = document.getElementById('testFilters');
  let html = '<button data-test="all" class="active">全部</button>';
  availableSources.forEach(function(s){
    html += '<button data-test="' + s + '">' + srcLabel(s) + '</button>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentFilter = btn.dataset.test;
      wrap.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
      renderSidebar();
      updateMeta();
    });
  });
}

function updateMeta() {
  const v = groups.filter(function(g){ return currentFilter === 'all' || g.source === currentFilter; });
  const p6 = v.filter(function(g){return g.part==='Part6';}).reduce(function(s,g){return s+(g.questions||[]).length;},0);
  const p7 = v.filter(function(g){return g.part==='Part7';}).reduce(function(s,g){return s+(g.questions||[]).length;},0);
  document.getElementById('meta').textContent =
    '共 ' + v.length + ' 组 · Part6 ' + p6 + '题 · Part7 ' + p7 + '题 · 合计 ' + (p6+p7) + '题';
}

function esc(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const sources = currentFilter === 'all' ? availableSources : [currentFilter];
  let html = '';
  sources.forEach(function(src){
    const sub = groups.map(function(g,i){return {g:g,i:i};}).filter(function(x){ return x.g.source === src; });
    if (!sub.length) return;
    html += '<div class="section">' + srcLabel(src) + '</div>';
    ['Part6','Part7'].forEach(function(part){
      const items = sub.filter(function(x){ return x.g.part === part; });
      if (!items.length) return;
      html += '<div class="section" style="padding-left:20px; font-size:10px;">' + part + '</div>';
      items.forEach(function(o){
        const g = o.g, i = o.i;
        const cls = g.part === 'Part7' ? 'part7' : '';
        let t = g.passageTitle || (g.passages && g.passages[0] && g.passages[0].title) || '(无标题)';
        const qn = (g.questions||[]).length;
        html += '<div class="item ' + cls + '" data-idx="' + i + '">'
          + '<div class="gid"><span class="badge">' + esc(g.groupId) + '</span>' + qn + '题</div>'
          + '<div class="title">' + esc(t) + '</div></div>';
      });
    });
  });
  sb.innerHTML = html;
  sb.querySelectorAll('.item').forEach(function(el){
    el.addEventListener('click', function(){ select(parseInt(el.dataset.idx)); });
  });
}

function select(i) {
  document.querySelectorAll('.item').forEach(function(el){ el.classList.toggle('active', parseInt(el.dataset.idx)===i); });
  renderMain(groups[i]);
}

function splitTrans(t, n) {
  if (!t) return [];
  if (n <= 1) return [t];
  const re = /【\s*文章\s*\d+\s*】/g;
  const parts = t.split(re).map(function(s){return s.trim();}).filter(Boolean);
  return parts.length === n ? parts : [t];
}

function renderMain(g) {
  const main = document.getElementById('main');
  const partCls = g.part === 'Part7' ? 'part7' : '';
  let title = g.passageTitle || (g.passages && g.passages[0] && g.passages[0].title) || '(无标题)';
  let html = '<div class="group-header">'
    + '<span class="pill test">' + srcLabel(g.source) + '</span>'
    + '<span class="pill ' + partCls + '">' + g.part + '</span>'
    + '<h2>' + esc(title) + '</h2>'
    + '<span class="stats">题号 ' + esc(g.groupId) + ' · ' + (g.questions||[]).length + ' 题</span></div>';

  let passages = [];
  if (g.passages && Array.isArray(g.passages) && g.passages.length > 0) passages = g.passages;
  else if (g.passageText) passages = [{title:'', text:g.passageText}];

  const transParts = splitTrans(g.passageTranslation || '', passages.length);

  passages.forEach(function(p, idx){
    const ptitle = p.title ? esc(p.title) : ('文章 ' + (idx+1));
    const ptext = esc(p.text || '');
    const trans = (transParts[idx] || '').trim();
    html += '<div class="passage"><h3>' + ptitle + '</h3>'
      + '<div class="body">' + ptext + '</div>'
      + (trans ? '<div class="zh">中文翻译：' + esc(trans) + '</div>' : '')
      + '</div>';
  });

  if (g.vocabulary && g.vocabulary.length) {
    let vh = '<div class="vocab-card"><h3>📖 词汇表（' + g.vocabulary.length + '）</h3><div class="vocab-list">';
    g.vocabulary.forEach(function(w){
      vh += '<div class="word"><span class="w">' + esc(w.word) + '</span>'
        + (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '')
        + '<span class="m">' + esc(w.meaning) + '</span></div>';
    });
    vh += '</div></div>';
    html += vh;
  }

  (g.questions||[]).forEach(function(q){
    const correct = q.correctAnswer || '';
    const cidx = 'ABCD'.indexOf(correct);
    let optsHtml = '';
    (q.options||[]).forEach(function(opt, i){
      const letter = 'ABCD'[i];
      const isCorrect = i === cidx;
      optsHtml += '<li class="' + (isCorrect?'correct':'') + '"><span class="opt-letter">(' + letter + ')</span>' + esc(opt) + (isCorrect?' ✓':'') + '</li>';
    });
    html += '<div class="question">'
      + '<div class="stem"><span class="num">' + q.number + '.</span>' + esc(q.questionText||'') + '</div>'
      + '<ul class="options">' + optsHtml + '</ul>'
      + (q.explanation ? '<div class="explanation"><span class="label">解析</span>' + esc(q.explanation) + '</div>' : '')
      + '</div>';
  });

  main.innerHTML = html;
  main.scrollTop = 0;
}

load().catch(function(e){ document.getElementById('main').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; });
</script>
</body>
</html>
