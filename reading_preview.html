<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TOEIC 阅读题预览（Part 6/7）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#1f2937;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100}
.header-main{display:flex;justify-content:space-between;align-items:center}
.header-main h1{font-size:16px}
header .meta{font-size:11px;opacity:.85;margin-top:3px}
.header-nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.header-nav a{flex:1 1 calc(33.33% - 4px);background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 6px;border-radius:14px;font-size:11px;cursor:pointer;text-align:center;text-decoration:none;transition:background 0.2s;white-space:nowrap}
.header-nav a:active{background:rgba(255,255,255,0.30)}
.header-nav .current{background:rgba(255,255,255,0.35);font-weight:600}
.mode-toggle{background:rgba(255,255,255,0.18);border:none;color:#fff;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;white-space:nowrap}
.toolbar{background:#fff;padding:8px 12px;border-bottom:1px solid #e5e7eb;display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap;position:sticky;top:92px;z-index:99}
.toolbar button{background:#f3f4f6;border:1px solid #e5e7eb;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap}
.toolbar button.active{background:#2563eb;color:#fff;border-color:#2563eb}
.toolbar .set-sel{margin-left:auto;display:flex;gap:4px}
.toolbar .set-sel button{font-size:10px;padding:3px 6px}
.layout{display:flex;min-height:calc(100vh - 100px)}
.sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0;position:sticky;top:140px;height:calc(100vh - 140px)}
.sidebar .section{padding:8px 12px;font-size:10px;font-weight:700;color:#6b7280;background:#f9fafb;border-bottom:1px solid #e5e7eb}
.sidebar .item{padding:8px 12px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.sidebar .item:hover{background:#f9fafb}
.sidebar .item.active{background:#dbeafe;border-left:3px solid #2563eb;padding-left:9px}
.sidebar .item .gid{font-weight:600;font-size:12px}
.sidebar .item .title{font-size:10px;color:#6b7280;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar .item .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;background:#e0e7ff;color:#3730a3;margin-right:3px}
.sidebar .item.part7 .badge{background:#fef3c7;color:#92400e}
.main{flex:1;overflow-y:auto;padding:16px 20px;max-width:800px}
.empty{text-align:center;color:#9ca3af;padding:60px 20px}
.group-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.group-header .pill{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff}
.group-header .pill.p6{background:#2563eb}
.group-header .pill.p7{background:#d97706}
.group-header .pill.set{background:#10b981}
.group-header h2{font-size:16px}
.passage{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.passage h3{margin:0 0 6px;font-size:12px;color:#1d4ed8}
.passage .body{white-space:pre-wrap;line-height:1.7;font-size:13px;font-family:Georgia,serif}
.passage .zh{background:#f0fdf4;padding:8px;border-radius:6px;margin-top:6px;border-left:3px solid #10b981;color:#374151;white-space:pre-wrap;line-height:1.6;font-size:12px}
.vocab-card{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.vocab-card h3{margin:0 0 8px;font-size:13px;color:#92400e}
.vocab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 10px;font-size:11px}
.vocab-list .word{padding:3px 0;border-bottom:1px dotted #fde68a}
.vocab-list .word .w{font-weight:700}
.vocab-list .word .pos{color:#9ca3af;font-size:10px;padding:0 3px}
.vocab-list .word .m{color:#374151}
.question{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.question .num{font-weight:700;color:#2563eb;margin-right:4px}
.question .stem{font-size:13px;line-height:1.6;margin-bottom:8px}
.options{list-style:none;margin:0 0 10px}
.options li{padding:5px 10px;border:1px solid #e5e7eb;border-radius:6px;margin-bottom:4px;font-size:12px}
.options li.correct{background:#d1fae5;border-color:#10b981;color:#065f46;font-weight:600}
.options li .opt-letter{display:inline-block;width:22px;font-weight:700}
.explanation{border-top:1px dashed #e5e7eb;padding-top:8px;font-size:12px;line-height:1.7;color:#374151;white-space:pre-wrap}
.explanation .label{display:inline-block;font-weight:600;font-size:10px;color:#fff;padding:2px 6px;border-radius:4px;margin-right:4px;background:#10b981}
.bottom-nav{display:none}
@media(max-width:768px){
  .sidebar{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;height:100vh;width:100%}
  .sidebar.mobile-open{display:block}
  .sidebar .close-btn{position:sticky;top:0;background:#2563eb;color:#fff;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;border:none;width:100%}
  .main{padding:12px;max-width:100%}
  .mobile-fab{position:fixed;bottom:20px;right:16px;width:48px;height:48px;border-radius:50%;background:#2563eb;color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,.4);z-index:150;display:flex;align-items:center;justify-content:center}
  .toolbar{top:0;padding-top:44px}
  header{padding:10px 14px}
  .sidebar{top:0;height:100vh}
  .toolbar .set-sel{margin-left:0;margin-top:4px;width:100%}
  .vocab-list{grid-template-columns:1fr}
  .passage .body{font-size:12px}
  .question .stem{font-size:12px}
  .options li{font-size:11px}
  .explanation{font-size:11px}
}
</style>
</head>
<body>
<header>
  <div class="header-main">
    <div>
      <h1>📖 阅读题预览</h1>
      <div class="meta" id="meta">加载中...</div>
    </div>
    <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">手机模式</button>
  </div>
  <div class="header-nav">
    <a href="index.html">🏠 主页</a>
    <a href="vocabulary_app.html">📘 单词</a>
    <a href="practice_coach.html">🧠 刷题</a>
    <a href="reading_preview.html" class="current">📖 阅读</a>
<a href="vocab_story.html">📖 故事</a>
    <a href="question_bank.html">🗄 题库</a>
    <a href="question_batch_generator.html">📦 批量生成</a>
  </div>
</header>
<div class="toolbar">
  <span>套题：</span>
  <div class="set-sel" id="setSel"></div>
</div>
<button class="mobile-fab" id="fabBtn" style="display:none" onclick="toggleSidebar()">&#9776;</button>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"><div class="empty">从左侧选择题组</div></div>
</div>
<script src="js/data_decrypt.js"></script>
<script>
var groups = [];
var currentSet = 'all';
var setData = {};
var isMobileMode = false;

function isMobile(){return isMobileMode||(window.innerWidth<=768&&!document.body.classList.contains('force-pc'))}
function toggleMode(){
  isMobileMode=!isMobileMode;
  var body=document.body,btn=document.getElementById('modeBtn');
  if(isMobileMode){body.classList.add('mobile-mode');body.classList.remove('force-pc');btn.textContent='PC模式'}
  else{body.classList.remove('mobile-mode');if(window.innerWidth<=768)body.classList.add('force-pc');btn.textContent='手机模式'}
  updateFab();renderSidebar();
}

function updateFab(){document.getElementById('fabBtn').style.display=isMobile()?'flex':'none'}

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function srcLabel(s){
  if(!s)return '?';
  var m=s.match(/^set(\d+)_test(\d+)$/i);
  if(m) return '公式'+m[1]+' 套'+m[2];
  return s.replace(/^set/i,'公式').replace(/_test1$/i,' 套1').replace(/_test2$/i,' 套2');
}

async function load(){
  try{
    var data = await DataDecrypt.fetchAndDecrypt('reading_bank.dat');
    groups = Array.isArray(data) ? data : [];
    setData = {};
    groups.forEach(function(g){
      var s = g.set || 0;
      var key = '公式' + String(s).padStart(2,'0');
      if(!setData[key]) setData[key] = [];
      setData[key].push(g);
    });
  }catch(e){
    console.error('load error',e);
    document.getElementById('main').innerHTML='<div class="empty">加载失败：'+(e.message||e)+'</div>';
    return;
  }
  renderSetButtons();
  renderSidebar();
  updateMeta();
  updateFab();
}

function renderSetButtons(){
  var wrap = document.getElementById('setSel');
  var html = '<button data-set="all" class="active">全部</button>';
  Object.keys(setData).sort().forEach(function(k){
    html += '<button data-set="'+k+'">'+k+'</button>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click',function(){
      currentSet = btn.dataset.set;
      if(currentSet==='all'){groups=[];Object.values(setData).forEach(function(d){groups=groups.concat(d)})}
      else{groups=setData[currentSet]||[]}
      wrap.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b===btn)});
      renderSidebar();
      updateMeta();
    });
  });
}

function updateMeta(){
  var p6=groups.filter(function(g){return g.part==='Part6'}).reduce(function(s,g){return s+(g.questions||[]).length},0);
  var p7=groups.filter(function(g){return g.part==='Part7'}).reduce(function(s,g){return s+(g.questions||[]).length},0);
  document.getElementById('meta').textContent='共 '+groups.length+' 组 · Part6 '+p6+'题 · Part7 '+p7+'题 · 合计 '+(p6+p7)+'题';
}

function renderSidebar(){
  var sb=document.getElementById('sidebar');
  var isMobileCheck=isMobile();
  var html='';
  if(isMobileCheck) html+='<button class="close-btn" onclick="toggleSidebar()">&#10005; 关闭选题</button>';
  // Group by set_test
  var setMap={};
  groups.forEach(function(g,i){
    var s=g.set||0;
    var m=(g.source||'').match(/test(\d)/i);
    var t=m?m[1]:'?';
    var key=s+'_'+t;
    if(!setMap[key]) setMap[key]={set:s,test:t,items:[]};
    setMap[key].items.push({g:g,i:i});
  });
  Object.keys(setMap).sort().forEach(function(key){
    var info=setMap[key];
    var label='公式'+String(info.set).padStart(2,'0')+' 套'+info.test;
    html+='<div class="section">'+label+' ('+info.items.length+'组)</div>';
    ['Part6','Part7'].forEach(function(part){
      var items=info.items.filter(function(x){return x.g.part===part});
      if(!items.length)return;
      html+='<div class="section" style="padding-left:18px;font-size:9px">'+part+'</div>';
      items.forEach(function(o){
        var g=o.g,i=o.i,cls=g.part==='Part7'?'part7':'';
        var t=g.passageTitle||(g.passages&&g.passages[0]&&g.passages[0].title)||'(无标题)';
        var qn=(g.questions||[]).length;
        html+='<div class="item '+cls+'" data-idx="'+i+'"><div class="gid"><span class="badge">'+esc(g.groupId)+'</span>'+qn+'题</div><div class="title">'+esc(t)+'</div></div>';
      });
    });
  });
  sb.innerHTML=html;
  sb.querySelectorAll('.item').forEach(function(el){
    el.addEventListener('click',function(){select(parseInt(el.dataset.idx));if(isMobile())toggleSidebar()});
  });
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
}

function select(i){
  document.querySelectorAll('.item').forEach(function(el){el.classList.toggle('active',parseInt(el.dataset.idx)===i)});
  renderMain(groups[i]);
}

function splitTrans(t,n){
  if(!t)return[];if(n<=1)return[t];
  var re=/【\s*文章\s*\d+\s*】/g;
  var parts=t.split(re).map(function(s){return s.trim()}).filter(Boolean);
  return parts.length===n?parts:[t];
}

function renderMain(g){
  var main=document.getElementById('main');
  var pcls=g.part==='Part7'?'p7':'p6';
  var title=g.passageTitle||(g.passages&&g.passages[0]&&g.passages[0].title)||'(无标题)';
  var html='<div class="group-header">'
    +'<span class="pill set">'+srcLabel(g.source)+'</span>'
    +'<span class="pill '+pcls+'">'+g.part+'</span>'
    +'<h2>'+esc(title)+'</h2>'
    +'<span style="font-size:11px;color:#6b7280">题号 '+esc(g.groupId)+' · '+(g.questions||[]).length+' 题</span></div>';

  var passages=[];
  if(g.passages&&Array.isArray(g.passages)&&g.passages.length>0)passages=g.passages;
  else if(g.passageText)passages=[{title:'',text:g.passageText}];

  var transParts=splitTrans(g.passageTranslation||'',passages.length);
  passages.forEach(function(p,idx){
    var pt=p.title?esc(p.title):('文章 '+(idx+1));
    var ptxt=esc(p.text||'');
    var trans=(transParts[idx]||'').trim();
    html+='<div class="passage"><h3>'+pt+'</h3>'
      +'<div class="body">'+ptxt+'</div>'
      +(trans?'<div class="zh">中文翻译：'+esc(trans)+'</div>':'')
      +'</div>';
  });

  if(g.vocabulary&&g.vocabulary.length){
    html+='<div class="vocab-card"><h3>词汇表（'+g.vocabulary.length+'）</h3><div class="vocab-list">';
    g.vocabulary.forEach(function(w){
      html+='<div class="word"><span class="w">'+esc(w.word)+'</span>'
        +(w.pos?'<span class="pos">'+esc(w.pos)+'</span>':'')
        +'<span class="m">'+esc(w.meaning)+'</span></div>';
    });
    html+='</div></div>';
  }

  (g.questions||[]).forEach(function(q){
    var correct=q.correctAnswer||'';
    var cidx='ABCD'.indexOf(correct);
    var optsHtml='';
    (q.options||[]).forEach(function(opt,i){
      var letter='ABCD'[i];
      var isC=i===cidx;
      optsHtml+='<li class="'+(isC?'correct':'')+'"><span class="opt-letter">('+letter+')</span>'+esc(opt)+(isC?' ✓':'')+'</li>';
    });
    html+='<div class="question">'
      +'<div class="stem"><span class="num">'+q.number+'.</span>'+esc(q.questionText||'')+'</div>'
      +'<ul class="options">'+optsHtml+'</ul>'
      +(q.explanation?'<div class="explanation"><span class="label">解析</span>'+esc(q.explanation)+'</div>':'')
      +'</div>';
  });

  main.innerHTML=html;
  main.scrollTop=0;
}

window.addEventListener('resize',function(){
  document.getElementById('fabBtn').style.display=isMobile()?'flex':'none';
});

load().catch(function(e){document.getElementById('main').innerHTML='<div class="empty">加载失败：'+e.message+'</div>'});
</script>
</body>
</html>
